[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vasco"
version = "0.1.0"
description = "CLI for AI web research: search, fetch, extract, map."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vasco contributors" }]
dependencies = [
    "typer>=0.12",
    "httpx[http2]>=0.27",
    "brotli>=1.1",  # so httpx can decode Content-Encoding: br
    "zstandard>=0.22",  # so httpx can decode Content-Encoding: zstd
    "ddgs>=9.0",
    "trafilatura>=2.0",
    "camoufox[geoip]>=0.4",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.7",
    "yt-dlp>=2024.10",
    "mcp>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
vasco = "vasco.interface.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
semantic = [
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["vasco"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
