[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vasco"
version = "0.1.0"
description = "CLI for AI web research: search, fetch, extract, map."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vasco contributors" }]
dependencies = [
    "typer>=0.12",
    "httpx[http2]>=0.27",
    "brotli>=1.1",  # so httpx can decode Content-Encoding: br
    "zstandard>=0.22",  # so httpx can decode Content-Encoding: zstd
    "ddgs>=9.0",
    "trafilatura>=2.0",
    "beautifulsoup4>=4.12",  # CSS-selector parsing for the realestate adapter
    "rank-bm25>=0.2.2",
    "tiktoken>=0.7",
    "yt-dlp>=2024.10",
    # yt-dlp needs secretstorage to decrypt Chromium-family (e.g. Brave) cookies
    # via the Secret Service API when youtube.cookies_from_browser is set; Linux-only.
    "secretstorage>=3.3; sys_platform == 'linux'",
    "mcp>=1.0",
    "pyyaml>=6.0",
    "tldextract>=5.3.1",
    "rich>=15",  # human-readable CLI rendering (also a transitive dep of typer)
]

[project.scripts]
vasco = "vasco.interface.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
semantic = [
    "sentence-transformers>=3.0",
]
# Camoufox (and its Playwright/Firefox bundle) is needed ONLY by the browser
# server (`vasco browser-server`). The fetch client proxies to that peer service
# and never launches a browser in-process, so core `vasco` doesn't depend on it.
# Install on the host that runs the browser server: `uv tool install '.[browser]'`.
browser = [
    "camoufox[geoip]>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["vasco"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
