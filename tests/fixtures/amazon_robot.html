<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Amazon.com.br</title>
  </head>
  <body>
    <div class="a-box-inner">
      <h4>Insira os caracteres que você vê abaixo</h4>
      <p class="a-last">
        Pedimos desculpas, só precisamos ter certeza de que você não é um robô.
        Para obter os melhores resultados, use um navegador que aceite cookies.
      </p>
      <form method="get" action="/errors/validateCaptcha" name="">
        <div class="a-row a-spacing-large">
          <div class="a-box">
            <div class="a-box-inner a-padding-extra-large">
              <img
                src="https://images-na.ssl-images-amazon.com/captcha/usvmgloq/Captcha_opfcaptcha-prod.jpg"
              />
              <input type="text" name="field-keywords" id="captchacharacters" />
            </div>
          </div>
        </div>
        <button type="submit" class="a-button-text">Continuar comprando</button>
      </form>
    </div>
    <footer>
      <p>
        Para discutir o acesso automatizado aos dados da Amazon, entre em contato
        com api-services-support@amazon.com.
      </p>
    </footer>
  </body>
</html>
