<!DOCTYPE html>
<html>
<head><title>Login</title></head>
<body>
  <div class="phabricator-login-view">
    <form action="/auth/start/" class="phabricator-login-form">
      <h1 class="phui-header-header">Log In or Register with LDAP</h1>
      <p>Click the MediaWiki button below to connect your Wikimedia unified account.</p>
      <input type="text" name="username" />
      <input type="password" name="password" />
      <button type="submit">Log In or Register</button>
    </form>
  </div>
</body>
</html>
